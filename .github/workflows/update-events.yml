name: Update events

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect events
        env:
          TM_KEY: ${{ secrets.TM_KEY }}
        run: node fetch-events.js

      - name: Save the results
        run: |
          git config user.name "events bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.js
          git diff --staged --quiet || git commit -m "Update events"
          git push
